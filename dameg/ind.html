<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img id="img2" src="phote/bb.jpg" alt="شعار" class="logo">
            <h2>تسجيل الدخول</h2>
            <p>مرحباً بك، يرجى تسجيل الدخول للمتابعة</p>
        </div>
        <form action="log.php" method="POST" class="login-form">
            <div class="input-group">
                <label for="text">رقم الهاتف أو البريد الإلكتروني</label>
                <input type="text" id="text" name="text" required placeholder="أدخل برقمك أو إيميلك">
            </div>
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="submit-btn">دخول</button>
        </form>
    </div>
</body>
</html>
